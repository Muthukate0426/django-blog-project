{% extends 'home/base.html' %}

{% block title %}
Profile
{% endblock %}

{% block content %}

<div class="row justify-content-center mt-5">

    <div class="col-md-6">

        <div class="card shadow-lg border-0">

            <div class="card-body p-5">

                <h2 class="text-center mb-4">
                    👤 My Profile
                </h2>

                <div class="text-center mb-4">

                    <img
                        src="{{ profile.image.url }}"
                        class="rounded-circle border shadow"
                        width="180"
                        height="180"
                        style="object-fit: cover;">

                </div>

                <form method="POST" enctype="multipart/form-data">

                    {% csrf_token %}

                    <div class="mb-3">

                        <label class="form-label">
                            Profile Photo
                        </label>

                        {{ form.image }}

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Username
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            name="username"
                            value="{{ user.username }}"
                            required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Email
                        </label>

                        <input
                            type="email"
                            class="form-control"
                            name="email"
                            value="{{ user.email }}"
                            required>

                    </div>

                    <button class="btn btn-success w-100">
                        💾 Save Changes
                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
