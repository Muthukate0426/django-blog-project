{% extends 'home/base.html' %}


{% block title %}
Register
{% endblock %}



{% block content %}



<div class="text-center my-5">


<h1 class="display-4 fw-bold">
Register 🚀
</h1>


<p class="lead">
Create your Django account.
</p>


</div>





<div class="row justify-content-center">


<div class="col-md-6">


<div class="card shadow p-4">



<form method="POST">


{% csrf_token %}





<div class="mb-3">


<label class="form-label">
Username
</label>


<input type="text"
class="form-control"
name="username"
placeholder="Enter username"
required>


</div>





<div class="mb-3">


<label class="form-label">
Email
</label>


<input type="email"
class="form-control"
name="email"
placeholder="Enter email"
required>


</div>





<div class="mb-3">


<label class="form-label">
Password
</label>


<input type="password"
class="form-control"
name="password"
placeholder="Enter password"
required>


</div>





<div class="mb-3">


<label class="form-label">
Confirm Password
</label>


<input type="password"
class="form-control"
name="password2"
placeholder="Confirm password"
required>


</div>





<button class="btn btn-primary btn-lg w-100">

Create Account 🚀

</button>



</form>



<hr>


<p class="text-center">

Already have an account?


<a href="/login/">

Login here

</a>


</p>



</div>


</div>


</div>




{% endblock %}
