{% extends 'home/base.html' %}


{% block title %}
Login
{% endblock %}



{% block content %}



<div class="text-center my-5">

<h1 class="display-4 fw-bold">
Login 🚀
</h1>


<p class="lead">
Login to your Django account.
</p>


</div>





<div class="row justify-content-center">


<div class="col-md-6">



<div class="card shadow p-4">



<form method="POST">


{% csrf_token %}




<div class="mb-3">


<label class="form-label">

Username

</label>


<input type="text"
class="form-control"
name="username"
placeholder="Enter username"
required>


</div>





<div class="mb-3">


<label class="form-label">

Password

</label>


<input type="password"
class="form-control"
name="password"
placeholder="Enter password"
required>


</div>





<button class="btn btn-success btn-lg w-100">

Login 🚀

</button>




</form>



<hr>



<p class="text-center">

Don't have an account?


<a href="/register/">

Register here

</a>


</p>



</div>


</div>


</div>




{% endblock %}
